<!doctype html>
<html lang="en">
  <head>
    <meta
      name="google-site-verification"
      content="4rNHXzkBZCRtRXagl6JN2BLseMnH3cTB4aosEKXNbuM"
    />
    <meta
      name="description"
      content="یک ماشین حساب ساده و زیبا ساخته شده با HTML، CSS و JavaScript"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator roz ماشین حساب رز</title>
    <link rel="stylesheet" href="./style.css" />
    <script defer src="./script.js"></script>
  </head>
  <body>
    <div class="calculator">
      <div class="history" id="history"></div>
      <div class="display" id="display">0</div>

      <div class="buttons">
        <button class="btn-action" data-action="clear">C</button>
        <button class="btn-action" data-action="delete">⌫</button>
        <button class="btn-action" data-action="%">%</button>
        <button class="btn-operator" data-operation="/">÷</button>

        <button class="btn-number" data-number="7">7</button>
        <button class="btn-number" data-number="8">8</button>
        <button class="btn-number" data-number="9">9</button>
        <button class="btn-operator" data-operation="*">×</button>

        <button class="btn-number" data-number="4">4</button>
        <button class="btn-number" data-number="5">5</button>
        <button class="btn-number" data-number="6">6</button>
        <button class="btn-operator" data-operation="-">-</button>

        <button class="btn-number" data-number="1">1</button>
        <button class="btn-number" data-number="2">2</button>
        <button class="btn-number" data-number="3">3</button>
        <button class="btn-operator" data-operation="+">+</button>

        <button class="btn-number span-two" data-number="0">0</button>
        <button class="btn-number" data-number=".">.</button>
        <button class="btn-equals" data-operation="=">=</button>
      </div>
    </div>
  </body>
</html>
